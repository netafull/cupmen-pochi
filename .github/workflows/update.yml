name: update

on:
  # 姉妹サイト(回転寿司ポチ・コンビニポチ等)と同じく、定期実行はGitHubのscheduleを使わず
  # Google Cloud Schedulerからworkflow_dispatch APIを叩く前提にする(scheduleもpushトリガーも付けない)。
  # 理由: GitHub側のscheduleは公称間隔に対し最長12時間超の欠測が実測されており、
  # workflow_dispatchはその間引きの対象外のため。
  #
  # 発火元: Cloud Schedulerのジョブ(運営者の確認後に作成する予定。名前は cupmen-pochi-update、
  #   毎朝9:00 JSTに1日1回を想定)。カップ麺の新商品の掲載は日次で十分。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    # ubuntu-latest は2026-10-19からUbuntu 26に切り替わる(GitHubの予告)。実行環境が変わって
    # 動かなくなるのを避けるため、現在のUbuntu 24.04に固定している。切り替えるときは動作を確認してから変えること
    runs-on: ubuntu-24.04
    # 各社2秒間隔・1社1回50リクエストまで(4社で最大200、待ち時間だけで最大約7分)。
    # 通常日は一覧の1〜3リクエストと、新しく見つかった商品の詳細だけ(日清は30日ごとの再確認が最大3件)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: 新商品を取得
        # 標準ライブラリだけ(pip install は不要)
        run: python3 scripts/crawl.py

      - name: ネタフルのレビュー記事を取得・照合
        # ネタフル側の失敗はサイト更新全体を止めない(スクリプト内でエラーを記録するだけで常に正常終了する)
        run: python3 scripts/fetch_netaful_reviews.py

      - name: サイトを生成
        run: python3 scripts/generate_site.py

      - name: コミットしてプッシュ
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 新商品は新規ファイルとして増えるので、git diff ではなく untracked も見る
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし"
            exit 0
          fi
          git add -A
          # コンフリクトマーカーが混入したままコミットされる事故が既存サイトで起きているため、push前に必ず確認する
          if git grep -qE '^(<<<<<<<|>>>>>>>)' -- data/ docs/; then
            echo "::error::コンフリクトマーカーを検出したため中止します"
            exit 1
          fi
          git commit -m "新商品情報を更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          # 衝突しうるのは docs/ の生成物だけ。取り込んだあとサイトを再生成して、生成物をデータと必ず一致させる
          git pull --rebase -X theirs origin main
          python3 scripts/generate_site.py
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "サイトを再生成 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          fi
          git push origin HEAD:main

      # 通知の一時停止スイッチ。リポジトリ変数 NTFY_PAUSED を "true" にすると、この2つの通知ステップをまとめて飛ばす。
      #   停止: gh variable set NTFY_PAUSED --body true  -R netafull/cupmen-pochi
      #   再開: gh variable delete NTFY_PAUSED          -R netafull/cupmen-pochi
      # 注意: 失敗通知も止まるので、停止中は更新が止まっても鳴らない
      - name: 新商品を通知
        if: success() && vars.NTFY_PAUSED != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/notify.py --summary

      - name: 失敗を通知
        if: failure() && vars.NTFY_PAUSED != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/notify.py --failure
